services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hitlhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hitlhub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hitlhub"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  hitlhub_postgres:
